workflows:
  react-native-ios-unsigned:
    name: React Native iOS Unsigned Test Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Generate iOS native project (expo prebuild)
        script: |
          npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build iOS Application (Unsigned)
        script: |
          cd ios
          xcodebuild -workspace MobilServisiniz.xcworkspace -scheme MobilServisiniz \
            -configuration Debug -sdk iphonesimulator -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - mobile/ios/build/Build/Products/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app

  react-native-ios-sideload:
    name: React Native iOS Unsigned Device IPA (Sideloadly icin)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Generate iOS native project (expo prebuild)
        script: |
          npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build iOS Application (Unsigned, gercek cihaz icin)
        script: |
          cd ios
          xcodebuild -workspace MobilServisiniz.xcworkspace -scheme MobilServisiniz \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package as unsigned .ipa (Payload/App.app)
        script: |
          cd ios
          echo ">> build/ altindaki .app dosyalari araniyor..."
          APP_PATH=$(find build/Build/Products -maxdepth 3 -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "HATA: .app bulunamadi. build/ klasor yapisi:"
            find build -maxdepth 6 2>/dev/null || echo "build/ klasoru de yok!"
            exit 1
          fi
          echo ">> Bulunan .app: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -y "$CM_BUILD_DIR/mobile/MobilServisiniz-unsigned.ipa" Payload
          echo ">> IPA olusturuldu: $CM_BUILD_DIR/mobile/MobilServisiniz-unsigned.ipa"
          ls -la "$CM_BUILD_DIR/mobile/"*.ipa
    artifacts:
      - mobile/MobilServisiniz-unsigned.ipa

  react-native-ios:
    name: React Native iOS Build (Ad Hoc, imzali)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        # Ad-hoc: cihaz UDID'leri Apple Developer hesabinizda kayitli olmali.
        # App Store/TestFlight'a yuklemek icin "app_store" yapin.
        distribution_type: ad_hoc
        bundle_identifier: com.otoservis.app
      vars:
        XCODE_WORKSPACE: "MobilServisiniz.xcworkspace"
        XCODE_SCHEME: "MobilServisiniz"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Generate iOS native project (expo prebuild)
        script: |
          npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/mobile/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - "**/build/Build/Products/Debug-iphoneos/*.app"
      - "**/*.ipa"
      - "**/*.app"
