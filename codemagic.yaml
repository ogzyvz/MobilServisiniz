workflows:
  react-native-ios:
    name: React Native iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    working_directory: mobile
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        # Ad-hoc: cihaz UDID'leri Apple Developer hesabinizda kayitli olmali (link ile kurulum).
        # App Store/TestFlight'a yuklemek icin "app_store" yapin.
        # Kurumsal (Apple Developer Enterprise) hesabiniz varsa "enterprise" yapin.
        distribution_type: ad_hoc
        bundle_identifier: com.otoservis.app
      vars:
        XCODE_WORKSPACE: "MobilServisiniz.xcworkspace"
        XCODE_SCHEME: "MobilServisiniz"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Generate iOS native project (expo prebuild)
        script: |
          npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/mobile/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
